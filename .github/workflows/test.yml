name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # Unit tests for the editor-independent core, then the plugin zip.
      # `buildPlugin` runs the publish guard first (scripts/check_publish.py):
      # English-only, no internal notes.
      - run: ./gradlew --no-daemon test buildPlugin
